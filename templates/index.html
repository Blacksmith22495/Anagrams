<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluid Anagram Lounge</title>
    <style>
        :root {
            --bg-main: #121824; --panel-bg: #1e293b; --accent: #3b82f6;
            --accent-success: #10b981; --accent-warn: #f59e0b; --accent-error: #ef4444;
            --text-light: #f8fafc; --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-light); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .app-container { width: 100%; max-width: 1100px; display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .app-container { grid-template-columns: 1fr; } }
        
        .panel { background-color: var(--panel-bg); border-radius: 12px; padding: 24px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); position: relative; }
        .sidebar-column { display: flex; flex-direction: column; gap: 20px; }
        
        h1 { color: var(--text-light); margin-bottom: 8px; font-weight: 700; }
        .room-tag { font-size: 0.9rem; color: var(--text-muted); background: rgba(255,255,255,0.05); padding: 4px 12px; border-radius: 20px; display: inline-block; }
        
        .timer-banner { font-size: 2.2rem; font-weight: 800; text-align: center; margin: 15px 0; color: var(--accent-warn); font-family: monospace; }
        .status-msg { text-align: center; font-weight: bold; margin-bottom: 15px; color: var(--accent-error); font-size: 1.1rem; }
        .host-controls { background: rgba(255,255,255,0.03); border: 1px dashed #334155; padding: 15px; border-radius: 8px; margin-bottom: 15px; display: none; }
        
        .letter-tray { display: flex; gap: 10px; justify-content: center; margin: 20px 0; min-height: 60px; }
        .letter-tile { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; width: 55px; height: 55px; display: flex; justify-content: center; align-items: center; font-size: 1.8rem; font-weight: bold; border-radius: 8px; text-transform: uppercase; }
        
        .control-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"], input[type="number"] { padding: 12px 16px; border-radius: 8px; border: 2px solid #334155; background-color: #0f172a; color: white; font-size: 1.1rem; outline: none; }
        input[type="text"] { flex: 1; }
        input:disabled, button:disabled { opacity: 0.4; cursor: not-allowed; }
        
        button { padding: 12px 24px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; transition: all 0.2s; font-size: 1rem; }
        .btn-primary { background-color: var(--accent); color: white; }
        .btn-success { background-color: var(--accent-success); color: white; }
        .btn-danger { background-color: var(--accent-error); color: white; }
        .btn-secondary { background-color: #334155; color: var(--text-light); }
        
        .my-words-box { margin-top: 15px; background: #0f172a; padding: 12px; border-radius: 8px; min-height: 50px; border: 1px solid #334155; }
        .word-token { display: inline-block; background: #334155; padding: 4px 10px; border-radius: 15px; margin: 4px; font-size: 0.9rem; font-weight: 600; text-transform: uppercase; }
        .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 5px; }
        .leaderboard-table th, .leaderboard-table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #334155; }
        
        .chat-box { height: 200px; overflow-y: auto; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; margin-bottom: 10px; font-size: 0.95rem; }
        .chat-row { margin-bottom: 6px; word-wrap: break-word; }
        .chat-name { color: var(--accent); font-weight: bold; margin-right: 4px; }
        
        #notification-toast { position: fixed; bottom: 20px; right: 20px; background: rgba(30,41,59,0.95); border: 2px solid var(--accent); color: white; padding: 16px 24px; border-radius: 8px; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.4s ease-in-out; }
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-main); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .auth-modal { background: var(--panel-bg); padding: 35px; border-radius: 12px; width: 100%; max-width: 450px; }
        
        #inline-results-panel { display: none; background: #0f172a; border: 1px solid #334155; padding: 20px; border-radius: 8px; margin: 15px 0; }
        .breakdown-list { max-height: 180px; overflow-y: auto; margin: 10px 0; padding-right: 5px; }
        .breakdown-row { display: flex; justify-content: space-between; padding: 6px 8px; border-bottom: 1px solid #1e293b; text-transform: uppercase; font-weight: bold; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-modal">
            <h2 style="margin-bottom:20px;">Join Anagram Arena</h2>
            <div class="control-group" style="flex-direction: column;">
                <input type="text" id="username-input" placeholder="Screen name..." maxlength="15">
                <input type="text" id="room-input" placeholder="Room Code (Empty for Default)">
                <button class="btn-primary" onclick="connectToLobby()">Enter Arena</button>
            </div>
        </div>
    </div>

    <div id="notification-toast">Word Saved!</div>

    <div class="app-container">
        <div class="panel main-arena">
            <h1>Anagram Arena</h1>
            <span class="room-tag" id="room-display">Room: lounge</span>
            
            <div class="timer-banner" id="timer-display">00:60</div>
            <div class="status-msg" id="lock-status-msg">ROUND WAITING TO BEGIN</div>

            <div id="inline-results-panel">
                <h3 id="breakdown-title" style="color:var(--accent-warn); margin-bottom:5px;">Round Finished</h3>
                <p style="font-size:0.85rem; color:var(--text-muted);">Base word: <span id="reveal-root-word" style="color:white; font-weight:bold; text-transform:uppercase;"></span></p>
                <div class="breakdown-list" id="breakdown-list-container"></div>
                <div id="inline-host-action" style="display:none; margin-top:12px;">
                    <button class="btn-success" style="width:100%;" onclick="controlTimer('start')">👑 Start Next Round</button>
                </div>
                <p id="inline-wait-msg" style="font-size:0.8rem; color:var(--accent-success); text-align:center; font-weight:bold; margin-top:8px;">Waiting for Host to start the next round...</p>
            </div>

            <div class="host-controls" id="host-panel">
                <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:10px;">👑 HOST DASHBOARD</p>
                <div style="display:flex; gap:10px; align-items:center;">
                    <button class="btn-success" id="host-start-btn" style="padding:8px 16px;" onclick="controlTimer('start')">▶ Start Round</button>
                    <button class="btn-secondary" id="host-pause-btn" style="padding:8px 16px;" onclick="controlTimer('pause')">⏸ Pause</button>
                    <input type="number" id="limit-input" value="60" style="width:80px; padding:6px;" min="10">
                    <button class="btn-secondary" style="padding:8px 16px;" onclick="updateLimit()">Set Limit</button>
                </div>
            </div>
            
            <div class="letter-tray" id="letter-tray"></div>

            <form id="game-form" onsubmit="submitWordLocal(event)">
                <div class="control-group">
                    <input type="text" id="guess-input" placeholder="Type word & press enter..." autocomplete="off" disabled>
                    <button type="submit" id="guess-submit-btn" class="btn-primary" disabled>Add Word</button>
                </div>
            </form>

            <h3>Your Submissions This Round:</h3>
            <div class="my-words-box" id="local-words-box"></div>
            
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn-secondary" id="shuffle-btn" onclick="shuffleTray()">🔀 Shuffle Letters</button>
                <button class="btn-danger" id="skip-btn" style="display:none;" onclick="controlTimer('skip')">⏭ Skip & Score Round</button>
            </div>
        </div>

        <div class="sidebar-column">
            <div class="panel score-board">
                <h3 style="margin-bottom:10px;">Standings</h3>
                <table class="leaderboard-table">
                    <thead><tr><th>Player</th><th>Score</th></tr></thead>
                    <tbody id="leaderboard-body"></tbody>
                </table>
            </div>

            <div class="panel chat-module">
                <h3 style="margin-bottom:10px;">Room Chat</h3>
                <div class="chat-box" id="chat-stream-box"></div>
                <form id="chat-form" onsubmit="sendChatMessage(event)">
                    <div class="control-group" style="margin-bottom: 0; gap: 6px;">
                        <input type="text" id="chat-input" placeholder="Type chat..." autocomplete="off" style="padding: 8px 12px; font-size: 0.95rem;">
                        <button type="submit" class="btn-primary" style="padding: 8px 14px; font-size: 0.95rem;">Send</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script>
        let currentRoom = "lounge";
        let myPid = null;
        let localLetters = [];
        let localRoundWords = [];
        let amHost = false;
        let currentRoundId = -1;
        let localChatCounter = 0;

        const urlParams = new URLSearchParams(window.location.search);
        if(urlParams.get('room')) document.getElementById('room-input').value = urlParams.get('room');

        async function connectToLobby() {
            const name = document.getElementById('username-input').value.trim();
            const roomInput = document.getElementById('room-input').value.trim();
            if(!name) return;
            currentRoom = roomInput || "lounge";
            document.getElementById('room-display').innerText = `Room: ${currentRoom}`;
            window.history.replaceState({}, '', `?room=${encodeURIComponent(currentRoom)}`);

            const res = await fetch('/api/join', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name, room: currentRoom, pid: myPid })
            });
            const data = await res.json();
            myPid = data.pid;
            handleBroadcast(data.state, data.is_host);
            document.getElementById('auth-overlay').style.display = 'none';
            setInterval(syncLoop, 1000);
        }

        async function syncLoop() {
            try {
                const res = await fetch('/api/sync', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ room: currentRoom, pid: myPid, buffered_words: localRoundWords, last_chat_id: localChatCounter })
                });
                if (res.status === 404) { window.location.reload(); return; }
                const data = await res.json();
                handleBroadcast(data.state, data.is_host);
                if (data.breakdown) showInlineBreakdown(data.breakdown);
            } catch(e) {}
        }

        function handleBroadcast(state, isHost) {
            amHost = isHost;
            document.getElementById('host-panel').style.display = amHost ? 'block' : 'none';
            document.getElementById('skip-btn').style.display = amHost ? 'block' : 'none';
            document.getElementById('inline-host-action').style.display = amHost ? 'block' : 'none';
            document.getElementById('inline-wait-msg').style.display = amHost ? 'none' : 'block';
            
            if (state.round_id !== currentRoundId) {
                currentRoundId = state.round_id;
                localLetters = [...state.letters];
                renderLetters(localLetters);
                localRoundWords = [];
                renderLocalWords();
                document.getElementById('inline-results-panel').style.display = 'none';
            }
            
            let currentSig = state.letters.join("");
            let traySig = Array.from(document.getElementById('letter-tray').children).map(c => c.innerText).join("");
            if(currentSig !== traySig) {
                localLetters = [...state.letters];
                renderLetters(localLetters);
            }
            
            updateTimerDisplay(state.time_left);
            appendIncrementalChats(state.new_chats);
            
            const txtInput = document.getElementById('guess-input');
            const btnSubmit = document.getElementById('guess-submit-btn');
            const btnShuffle = document.getElementById('shuffle-btn');
            const statusLabel = document.getElementById('lock-status-msg');
            
            if (state.timer_active) {
                txtInput.disabled = false; btnSubmit.disabled = false; btnShuffle.disabled = false;
                statusLabel.innerText = "ROUND RUNNING - ENTRY ACTIVE"; statusLabel.style.color = "var(--accent-success)";
            } else {
                txtInput.disabled = true; btnSubmit.disabled = true; btnShuffle.disabled = true;
                statusLabel.innerText = "BOARD LOCKED - ROUND PAUSED/WAITING"; statusLabel.style.color = "var(--accent-warn)";
            }
            
            const tbody = document.getElementById('leaderboard-body'); tbody.innerHTML = '';
            state.leaderboard.forEach(p => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td><strong>${p.name}${p.is_host ? ' 👑':''}</strong></td><td>${p.score} pts</td>`;
                tbody.appendChild(tr);
            });
        }

        async function sendChatMessage(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input'); const msg = input.value.trim();
            if(!msg) return; input.value = '';
            const res = await fetch('/api/chat', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ room: currentRoom, pid: myPid, msg: msg, last_chat_id: localChatCounter })
            });
            const data = await res.json();
            if(data.state) handleBroadcast(data.state, amHost);
        }

        function appendIncrementalChats(newChatsList) {
            if (!newChatsList || newChatsList.length === 0) return;
            const box = document.getElementById('chat-stream-box');
            newChatsList.forEach(c => {
                if (c.id > localChatCounter) {
                    localChatCounter = c.id;
                    const row = document.createElement('div'); row.className = 'chat-row';
                    row.innerHTML = `<span class="chat-name">${escapeHtml(c.name)}:</span><span>${escapeHtml(c.msg)}</span>`;
                    box.appendChild(row);
                }
            });
            box.scrollTop = box.scrollHeight;
        }

        function submitWordLocal(e) {
            e.preventDefault();
            const input = document.getElementById('guess-input'); const guess = input.value.trim().toLowerCase();
            if (!guess) return; input.value = '';
            if (guess.length < 3 || guess.length > 6) { launchToast("Must be 3-6 letters!"); return; }
            if (localRoundWords.includes(guess)) { launchToast("Word already on board!"); return; }
            localRoundWords.push(guess); renderLocalWords(); input.focus();
        }

        function renderLocalWords() {
            const box = document.getElementById('local-words-box'); box.innerHTML = '';
            localRoundWords.forEach(word => {
                const span = document.createElement('span'); span.className = 'word-token'; span.innerText = word;
                box.appendChild(span);
            });
        }

        function showInlineBreakdown(data) {
            document.getElementById('breakdown-title').innerText = data.skipped ? "Round Skipped by Host" : "Round Time Expired";
            document.getElementById('reveal-root-word').innerText = data.round_word;
            const container = document.getElementById('breakdown-list-container'); container.innerHTML = '';
            if (data.breakdown.length === 0) {
                container.innerHTML = `<p style="text-align:center; padding:10px; color:var(--text-muted);">No words submitted.</p>`;
            } else {
                data.breakdown.forEach(item => {
                    const row = document.createElement('div'); row.className = 'breakdown-row';
                    const color = item.valid ? 'var(--accent-success)' : 'var(--accent-error)';
                    const label = item.valid ? `+${item.points} PTS` : 'INVALID';
                    row.innerHTML = `<span>${item.word}</span><span style="color:${color};">${label}</span>`;
                    container.appendChild(row);
                });
            }
            document.getElementById('inline-results-panel').style.display = 'block';
        }

        function launchToast(msg) {
            const toast = document.getElementById('notification-toast'); toast.innerText = msg; toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 2000);
        }

        async function controlTimer(action) {
            await fetch('/api/control', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ room: currentRoom, pid: myPid, action })
            });
            syncLoop();
        }

        async function updateLimit() {
            const val = document.getElementById('limit-input').value;
            await fetch('/api/control', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ room: currentRoom, pid: myPid, action: 'limit', limit: val })
            });
            launchToast(`Time limit set to ${val}s!`); syncLoop();
        }

        function updateTimerDisplay(seconds) {
            const m = String(Math.floor(seconds / 60)).padStart(2, '0');
            const s = String(seconds % 60).padStart(2, '0');
            document.getElementById('timer-display').innerText = `${m}:${s}`;
        }

        function renderLetters(letters) {
            const tray = document.getElementById('letter-tray'); tray.innerHTML = '';
            letters.forEach(l => {
                const tile = document.createElement('div'); tile.className = 'letter-tile'; tile.innerText = l;
                tray.appendChild(tile);
            });
        }

        function shuffleTray() {
            if(localLetters.includes("?")) return;
            for (let i = localLetters.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [localLetters[i], localLetters[j]] = [localLetters[j], localLetters[i]];
            }
            renderLetters(localLetters);
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
