<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EduMatrix Game Lounge</title><style>
:root{--bg:#121824;--panel:#1e293b;--in:#0f172a;--blue:#3b82f6;--green:#10b981;--red:#ef4444;--yellow:#f59e0b;--muted:#94a3b8;--text:#f8fafc}*{box-sizing:border-box;font-family:Segoe UI,system-ui,sans-serif}body{margin:0;background:var(--bg);color:var(--text);padding:20px}.app{max-width:1150px;margin:auto;display:grid;grid-template-columns:2fr 1fr;gap:20px}.panel{background:var(--panel);border-radius:12px;padding:20px;box-shadow:0 8px 20px #0005}input,select{background:var(--in);color:white;border:1px solid #475569;border-radius:8px;padding:10px;font-size:1rem}input{width:100%}button{border:0;border-radius:8px;padding:10px 14px;font-weight:700;color:white;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.b{background:var(--blue)}.g{background:var(--green)}.r{background:var(--red)}.y{background:var(--yellow);color:#111}.s{background:#475569}.row{display:flex;gap:8px;margin:10px 0}.row>*{flex:1}.hide{display:none!important}.muted{color:var(--muted)}.timer{text-align:center;font:800 2.4rem monospace;color:var(--yellow);margin:12px}.letters,.cards{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:15px}.letter{width:55px;height:55px;background:var(--blue);display:grid;place-items:center;border-radius:8px;font-size:1.7rem;font-weight:800}.words{background:var(--in);padding:10px;border-radius:8px;min-height:45px}.word{display:inline-block;background:#334155;padding:5px 9px;border-radius:14px;margin:3px;text-transform:uppercase}.chat{height:190px;overflow:auto;background:var(--in);padding:10px;border-radius:8px}.chat b{color:#60a5fa}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:7px;border-bottom:1px solid #334155}.status{text-align:center;font-weight:800;margin:10px}.card{width:68px;height:96px;background:#f8fafc;color:#111827;border-radius:9px;border:2px solid #cbd5e1;padding:7px;display:flex;flex-direction:column;justify-content:space-between;font-weight:800}.redcard{color:#dc2626}.back{background:#1d4ed8!important;color:white!important;border-color:#93c5fd}.secret{font-size:2rem;text-align:center;background:var(--in);padding:18px;border-radius:10px;margin:12px}.clue,.vote{background:var(--in);padding:9px;border-radius:8px;margin:6px 0}.vote{width:100%;text-align:left;color:white;border:1px solid #475569}.poker{background:#07532d;border-radius:18px;padding:18px;min-height:420px}.community{min-height:105px}.pot{text-align:center;font-size:1.5rem;font-weight:800}.seat{display:flex;justify-content:space-between;padding:7px;border-bottom:1px solid #ffffff22}.result{font-size:1.3rem;text-align:center;font-weight:800;margin:12px}.toast{position:fixed;right:18px;bottom:18px;background:#1e293b;border:1px solid var(--blue);padding:12px 16px;border-radius:8px;display:none}@media(max-width:800px){.app{grid-template-columns:1fr}.panel{padding:14px}}
</style></head><body>
<form id="login" class="panel" style="max-width:430px;margin:80px auto"><h2>Join Game Lounge</h2><input id="name" type="text" maxlength="15" placeholder="Screen name" autocomplete="nickname" autofocus><div class="row"><input id="room" type="text" placeholder="Room code"><button class="b" id="join" type="submit">Join</button></div></form>
<div id="toast" class="toast"></div>
<div id="app" class="app hide"><main class="panel"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h1 id="title">Game Lounge</h1><select id="game"><option value="unselected">Select Game</option><option value="anagram">Anagrams</option><option value="twenty_questions">20 Questions</option><option value="blackjack">Blackjack</option><option value="imposter">Imposter</option><option value="poker">Texas Hold'em</option></select></div><div class="muted" id="roomLabel"></div><section id="lobby"><h3>Waiting for the host</h3><p class="muted">The host chooses the game.</p></section><section id="anagram" class="hide"><div class="timer" id="atimer">00:60</div><div class="timer hide" id="acount">3</div><div class="status" id="astatus">WAITING</div><div id="ares"></div><div class="letters" id="letters"></div><form id="guessForm"><div class="row"><input id="guess" placeholder="Enter anagram" disabled><button class="b" disabled id="guessBtn">Submit</button></div></form><div class="row"><button class="s" id="shuffle">Shuffle</button><button class="g" id="ready">Ready</button></div><div class="words" id="words"></div><div id="host" class="row hide"><button class="y" id="pause">Pause</button><input id="limit" type="number" value="60" min="10"><button class="s" id="setLimit">Set time</button><button class="r" id="skip">Skip</button></div></section><section id="tq" class="hide"><div id="tqbox"></div></section><section id="bj" class="hide"><h3>Blackjack</h3><div class="status" id="bjstatus"></div><h4 style="text-align:center">Dealer</h4><div class="cards" id="dealer"></div><div class="status" id="dealerv"></div><h4 style="text-align:center">Your hand</h4><div class="cards" id="mybj"></div><div class="status" id="mybjv"></div><div class="result" id="bjres"></div><div class="row"><button class="b" id="hit">Hit</button><button class="r" id="stand">Stand</button><button class="g hide" id="bjnext">Next round</button></div><div id="bjplayers"></div></section><section id="imp" class="hide"><div id="impbox"></div></section><section id="poker" class="hide"><div id="pokerbox"></div></section></main><aside><div class="panel"><h3>Leaderboard</h3><table><thead><tr><th>Player</th><th>Score</th></tr></thead><tbody id="board"></tbody></table></div><div class="panel" style="margin-top:20px"><h3>Chat</h3><div class="chat" id="chat"></div><form id="chatForm"><div class="row"><input id="chatInput" placeholder="Type chat"><button class="b">Send</button></div></form></div></aside></div>
<script>
let room="",pid="",host=false,lastChat=0,words=[],letters=[],round=-1;const $=x=>document.getElementById(x),esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function toast(x){$("toast").textContent=x;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",1800)}
async function api(u,b){let r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});return r.json()}
async function join(){let n=$("name").value.trim();if(!n)return toast("Enter a name");room=$("room").value.trim()||"lounge";let d=await api("/api/join",{name:n,room,pid:localStorage.pid});pid=d.pid;localStorage.pid=pid;host=d.is_host;$("login").classList.add("hide");$("app").classList.remove("hide");$("roomLabel").textContent="Room: "+room;render(d.state);setInterval(sync,900)}
async function sync(){if(!pid)return;try{let d=await api("/api/sync",{room,pid,buffered_words:words,last_chat_id:lastChat});if(d.error)return location.reload();render(d.state);if(d.breakdown)showBreakdown(d.breakdown)}catch(e){}}
function render(s){host=s.leaderboard?.some(x=>x.sid===pid&&x.is_host)||host;$("game").disabled=!host||s.game_locked;$("game").value=s.game_type;["lobby","anagram","tq","bj","imp","poker"].forEach(x=>$(x).classList.add("hide"));if(s.game_type==="unselected"){$("lobby").classList.remove("hide");$("title").textContent="Game Lounge"}else if(s.game_type==="anagram"){$("anagram").classList.remove("hide");$("title").textContent="Anagrams";anagram(s)}else if(s.game_type==="twenty_questions"){$("tq").classList.remove("hide");$("title").textContent="20 Questions";tq(s)}else if(s.game_type==="blackjack"){$("bj").classList.remove("hide");$("title").textContent="Blackjack";blackjack(s)}else if(s.game_type==="imposter"){$("imp").classList.remove("hide");$("title").textContent="Imposter";imposter(s)}else{$("poker").classList.remove("hide");$("title").textContent="Texas Hold'em";poker(s)};$("board").innerHTML=(s.leaderboard||[]).map(p=>`<tr><td>${p.is_host?"👑 ":""}${esc(p.name)}</td><td>${p.score}</td></tr>`).join("");(s.new_chats||[]).forEach(c=>{if(chatIds.has(c.id))return;chatIds.add(c.id);lastChat=Math.max(lastChat,c.id);let d=document.createElement("div");d.innerHTML=`<b>${esc(c.name)}:</b> ${esc(c.msg)}`;$("chat").appendChild(d)});$("chat").scrollTop=$("chat").scrollHeight}
function anagram(s){if(s.round_id!==round){round=s.round_id;words=[];$("words").innerHTML="";$("ares").innerHTML=""}letters=[...s.letters];$("letters").innerHTML=letters.map(x=>`<div class="letter">${esc(x)}</div>`).join("");$("atimer").textContent="00:"+String(s.time_left).padStart(2,"0");$("acount").classList.toggle("hide",!s.countdown_active);$("acount").textContent=s.time_left;$("guess").disabled=!s.timer_active;$("guessBtn").disabled=!s.timer_active;$("shuffle").disabled=!s.timer_active;$("ready").disabled=s.timer_active||s.countdown_active;$("astatus").textContent=s.timer_active?"ROUND RUNNING":s.countdown_active?"GET READY":"READY UP";$("host").classList.toggle("hide",!host)}
function submitGuess(e){e.preventDefault();let g=$("guess").value.trim().toLowerCase().replace(/[^a-z]/g,"");if(g.length<3||g.length>6)return toast("3-6 letters");if(words.includes(g))return toast("Already entered");let p=[...letters];for(let c of g){let i=p.indexOf(c);if(i<0)return toast("Invalid letters");p.splice(i,1)}words.push(g);$("words").innerHTML=words.map(x=>`<span class="word">${esc(x)}</span>`).join("");$("guess").value=""}
function showBreakdown(d){$("ares").innerHTML=`<div class="clue"><b>Word: ${esc(d.round_word)}</b></div>`+(d.breakdown||[]).map(x=>`<div style="color:${x.valid?"var(--green)":"var(--red)"}">${esc(x.word)} ${x.valid?"+"+x.points:"invalid"}</div>`).join("")}
async function gameAction(a,b={}){let d=await api("/api/game_switch",{room,pid,game_type:a});render(d.state)}
function tq(s){let h="";if(s.tq_status==="waiting_thinker")h=`<h3>Choose the thinker</h3><button class="b" id="think">Volunteer</button>`;else if(s.tq_status==="waiting_word")h=s.tq_thinker_pid===pid?`<h3>Choose secret word</h3><div class="row"><input id="secret"><button class="b" id="setsecret">Set</button></div>`:`<h3>Thinker is choosing a word...</h3>`;else{h=`<p>Questions: ${s.tq_questions.length}/20</p>`+(s.tq_questions||[]).map(q=>`<div class="clue"><b>${esc(q.name)}:</b> ${esc(q.text)} <span style="color:${q.answer==="No"?"var(--red)":q.answer==="Maybe"?"var(--yellow)":"var(--green)"}">${q.answer?"["+esc(q.answer)+"]":"[PENDING]"}</span>${s.tq_thinker_pid===pid&&!q.answer?`<div class="row"><button class="g ans" data-i="${q.id}" data-a="Yes">Yes</button><button class="r ans" data-i="${q.id}" data-a="No">No</button><button class="y ans" data-i="${q.id}" data-a="Maybe">Maybe</button><button class="b ans" data-i="${q.id}" data-a="Correct">Correct</button></div>`:""}</div>`).join("");if(s.tq_status==="won")h+=`<h3 style="color:var(--green)">The word was ${esc(s.tq_secret_word)}</h3><button class="b" id="nexttq">Next round</button>`;else if(s.tq_thinker_pid!==pid)h+=`<div class="row"><input id="qinput" placeholder="Ask a yes/no question"><button class="b" id="ask">Ask</button></div>`}$("tqbox").innerHTML=h;$("think")?.addEventListener("click",()=>tqAction("become_thinker"));$("setsecret")?.addEventListener("click",()=>tqAction("set_word",{word:$("secret").value}));$("ask")?.addEventListener("click",()=>tqAction("ask_question",{text:$("qinput").value}));$("nexttq")?.addEventListener("click",()=>tqAction("become_thinker"));document.querySelectorAll(".ans").forEach(b=>b.onclick=()=>tqAction("answer_question",{qid:+b.dataset.i,answer:b.dataset.a}))}
async function tqAction(a,b={}){let d=await api("/api/tq_action",{room,pid,action:a,...b});render(d.state)}
function cards(h,hidden=false){return (h||[]).map((c,i)=>{let back=hidden&&i===1||c.rank==="?";return `<div class="card ${back?"back":c.suit==="♥"||c.suit==="♦"?"redcard":""}">${back?"?":`<span>${c.rank}${c.suit}</span><span style="text-align:center;font-size:1.4rem">${c.suit}</span><span>${c.rank}${c.suit}</span>`}</div>`}).join("")}
function blackjack(s){let b=s.blackjack;$("dealer").innerHTML=cards(b.dealer_hand,b.status==="playing");$("mybj").innerHTML=cards(b.your_hand);$("dealerv").textContent=b.dealer_value?"Value: "+b.dealer_value:b.status==="playing"?"One card hidden":"";$("mybjv").textContent=b.your_hand?.length?"Value: "+b.your_value:"";$("hit").disabled=!b.can_hit;$("stand").disabled=!b.can_stand;$("bjnext").classList.toggle("hide",!(b.status==="finished"&&host));let map={blackjack:["BLACKJACK! +15","var(--green)"],win:["YOU WIN! +10","var(--green)"],push:["PUSH! +5","var(--yellow)"],lose:["YOU LOSE","var(--red)"]};$("bjres").textContent=b.your_result?(map[b.your_result]||[b.your_result])[0]:"";$("bjstatus").textContent=b.status==="playing"?(b.your_status==="playing"?"Your turn — Hit or Stand":b.your_status||"Waiting..."):b.status==="dealer"?"Dealer is playing...":b.status==="finished"?"Round finished":"Waiting";$("bjplayers").innerHTML=(b.players||[]).map(p=>`<div class="seat"><span>${esc(p.name)}${p.sid===pid?" (You)":""}</span><span>${p.cards} cards — ${esc(p.result||p.status||"waiting")}</span></div>`).join("")}
async function bjAction(a){let d=await api("/api/blackjack_action",{room,pid,action:a});if(d.message)toast(d.message);if(d.state)render(d.state)}
function imposter(s){let x=s.imp_status,h="";if(x==="waiting")h=`<h2>Find the Imposter</h2><p>Everyone gets the same word except one player, who gets a related word.</p>${host?`<button class="b" id="startimp" ${s.imp_round_ready?"":"disabled"}>Start round</button>`:`<p class="muted">Waiting for host...</p>`} `;else if(x==="clues"){let turn=s.imp_current_turn===pid;h=`<h3>Your word</h3><div class="secret">${esc(s.imp_your_word)}</div><p class="status">${turn?"YOUR TURN":"Waiting..."}</p>`+(s.imp_clues||[]).map(c=>`<div class="clue"><b>${esc(c.name)}:</b> ${esc(c.clue)}</div>`).join("");if(turn)h+=`<div class="row"><input id="clue" maxlength="30" placeholder="One word / short clue"><button class="b" id="sendclue">Submit</button></div>`}else if(x==="voting")h=`<h2>Vote for the imposter</h2>`+(s.imp_clues||[]).map(c=>`<div class="clue"><b>${esc(c.name)}:</b> ${esc(c.clue)}</div>`).join("")+s.imp_players.filter(p=>p.pid!==pid).map(p=>`<button class="vote" data-v="${p.pid}">${esc(p.name)}</button>`).join("");else{let r=s.imp_result;h=`<div class="result" style="color:${r.caught?"var(--green)":"var(--red)"}">${r.caught?"Imposter caught":"Imposter wins"}</div><p>Imposter: <b>${esc(r.name)}</b></p><p>Main word: <b>${esc(r.main)}</b> | Imposter word: <b>${esc(r.fake)}</b></p>`+Object.entries(r.votes).map(([id,n])=>`<div class="clue">${esc((s.imp_players.find(p=>p.pid===id)||{}).name||"Unknown")}: ${n}</div>`).join("")+ (host?`<button class="b" id="nextimp">Next round</button>`:"")}$("impbox").innerHTML=h;$("startimp")?.addEventListener("click",()=>impAction("start"));$("sendclue")?.addEventListener("click",()=>impAction("clue",{clue:$("clue").value}));document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>impAction("vote",{target:b.dataset.v}));$("nextimp")?.addEventListener("click",()=>impAction("next_round"))}
async function impAction(a,b={}){let d=await api("/api/imposter_action",{room,pid,action:a,...b});if(d.message)toast(d.message);render(d.state)}
function poker(s){let p=s.poker;if(p.phase==="waiting"){$("pokerbox").innerHTML=`<h2>Texas Hold'em</h2><p>At least 2 players are required.</p>${host&&p.players?.length>=2?'<button class="b" id="startp">Start hand</button>':''}`;$('startp')?.addEventListener('click',()=>pAction('start'));return}let h=`<div class="poker"><div class="pot">Pot: ${p.pot} chips</div><div class="cards community">${cards(p.community)}</div><p class="status">${p.phase.toUpperCase()} ${p.current===pid?'— YOUR TURN':''}</p><div class="cards">${cards(p.your_hand)}</div><p class="status">Your chips: ${p.your_chips} | Current bet: ${p.your_bet}</p><div class="row">`;if(p.can_act){h+=`<button class="r" id="fold">Fold</button><button class="s" id="check">${p.bet>p.your_bet?'Call':'Check'}</button><button class="b" id="raise">Raise</button><button class="y" id="allin">All-in</button>`}else h+='<span class="muted">Waiting for another player...</span>';h+='</div>';if(p.phase==='finished')h+=`<div class="result">Hand finished</div>${host?'<button class="g" id="nextp">Next hand</button>':'<p class="muted">Waiting for host...</p>'}`;h+=`</div><h3>Players</h3>`+(p.players||[]).map(x=>`<div class="seat"><span>${esc(x.name)}${x.pid===pid?' (You)':''}</span><span>${x.chips} chips · ${x.status}</span></div>`).join('');$("pokerbox").innerHTML=h;$('fold')?.addEventListener('click',()=>pAction('fold'));$('check')?.addEventListener('click',()=>pAction(p.bet>p.your_bet?'call':'check'));$('raise')?.addEventListener('click',()=>{let n=prompt('Raise to total bet:',String(p.bet+20));if(n)pAction('raise',{amount:+n})});$('allin')?.addEventListener('click',()=>pAction('allin'));$('nextp')?.addEventListener('click',()=>pAction('new_round'))}
async function pAction(a,b={}){let d=await api("/api/poker_action",{room,pid,action:a,...b});if(d.message)toast(d.message);render(d.state)}
async function switchGame(){let g=$("game").value;if(g==="unselected")return;let d=await api("/api/game_switch",{room,pid,game_type:g});render(d.state)}
async function chat(e){e.preventDefault();let m=$("chatInput").value.trim();if(!m)return;$("chatInput").value="";let d=await api("/api/chat",{room,pid,msg:m,last_chat_id:lastChat});render(d.state)}
$("login").addEventListener("submit",e=>{e.preventDefault();join()});$("game").onchange=switchGame;$("guessForm").onsubmit=submitGuess;$("ready").onclick=async()=>{let d=await api("/api/ready",{room,pid});render(d.state)};$("shuffle").onclick=()=>{for(let i=letters.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[letters[i],letters[j]]=[letters[j],letters[i]]}$("letters").innerHTML=letters.map(x=>`<div class="letter">${x}</div>`).join("")};$("pause").onclick=async()=>{let d=await api("/api/control",{room,pid,action:"pause"});render(d.state)};$("setLimit").onclick=async()=>{let d=await api("/api/control",{room,pid,action:"limit",limit:+$("limit").value});render(d.state)};$("skip").onclick=async()=>{let d=await api("/api/control",{room,pid,action:"skip"});render(d.state)};$("hit").onclick=()=>bjAction("hit");$("stand").onclick=()=>bjAction("stand");$("bjnext").onclick=()=>bjAction("new_round");$("chatForm").onsubmit=chat;
</script></body></html>
