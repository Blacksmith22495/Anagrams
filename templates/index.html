<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Game Lounge</title>
    <style>
        :root {
            --bg-main: #121824; --panel-bg: #1e293b; --accent: #3b82f6;
            --accent-success: #10b981; --accent-warn: #f59e0b; --accent-error: #ef4444;
            --text-light: #f8fafc; --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-light); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .app-container { width: 100%; max-width: 1100px; display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .app-container { grid-template-columns: 1fr; } }
        .panel { background-color: var(--panel-bg); border-radius: 12px; padding: 24px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); position: relative; }
        .sidebar-column { display: flex; flex-direction: column; gap: 20px; }
        h1 { color: var(--text-light); margin-bottom: 8px; font-weight: 700; }
        .room-tag { font-size: 0.9rem; color: var(--text-muted); background: rgba(255,255,255,0.05); padding: 4px 12px; border-radius: 20px; display: inline-block; }
        .timer-banner { font-size: 2.2rem; font-weight: 800; text-align: center; margin: 15px 0; color: var(--accent-warn); font-family: monospace; }
        .status-msg { text-align: center; font-weight: bold; margin-bottom: 15px; color: var(--accent-error); font-size: 1.1rem; }
        @keyframes alert-pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.03); } }
        .countdown-flash-banner { font-size: 3rem; font-weight: 900; text-align: center; color: var(--accent-error); animation: alert-pulse 0.5s linear infinite; margin: 20px 0; display: none; }
        .letter-tray { display: flex; gap: 10px; justify-content: center; margin: 20px 0; min-height: 60px; }
        .letter-tile { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; width: 55px; height: 55px; display: flex; justify-content: center; align-items: center; font-size: 1.8rem; font-weight: bold; border-radius: 8px; text-transform: uppercase; }
        .control-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"], input[type="number"] { padding: 12px 16px; border-radius: 8px; border: 2px solid #334155; background-color: #0f172a; color: white; font-size: 1.1rem; outline: none; flex: 1; }
        input:disabled, button:disabled { opacity: 0.4; cursor: not-allowed; }
    </style>
</head>
<style>
    button { padding: 12px 24px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; transition: all 0.2s; font-size: 1rem; }
    .btn-primary { background-color: var(--accent); color: white; }
    .btn-success { background-color: var(--accent-success); color: white; }
    .btn-danger { background-color: var(--accent-error); color: white; }
    .btn-secondary { background-color: #334155; color: var(--text-light); }
    .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 5px; }
    .leaderboard-table th, .leaderboard-table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #334155; }
    .chat-box { height: 180px; overflow-y: auto; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; margin-bottom: 10px; font-size: 0.95rem; }
    .chat-row { margin-bottom: 6px; word-wrap: break-word; }
    .chat-name { color: var(--accent); font-weight: bold; margin-right: 4px; }
    #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-main); display: flex; justify-content: center; align-items: center; z-index: 100; }
    .auth-modal { background: var(--panel-bg); padding: 35px; border-radius: 12px; width: 100%; max-width: 450px; }
    .game-section { display: none; }
    .tq-q-box { max-height: 180px; overflow-y: auto; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px; margin-bottom: 15px; }
</style>
<body>
    <div id="auth-overlay">
        <div class="auth-modal">
            <h2 style="margin-bottom:20px;">Join Game Lounge</h2>
            <div class="control-group" style="flex-direction: column;">
                <input type="text" id="username-input" placeholder="Screen name..." maxlength="15">
                <input type="text" id="room-input" placeholder="Room Code (Empty for Default)">
                <button class="btn-primary" onclick="connectToLobby()">Enter Lounge</button>
            </div>
        </div>
    </div>
    <div class="app-container">
        <div class="panel main-arena">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <h1 id="game-title">Select Room Game</h1>
                <div id="host-game-switcher" style="display:none;">
                    <select id="game-select-dropdown" onchange="switchGameMode(this.value)" style="padding:8px; background:#0f172a; color:white; border:2px solid #334155; border-radius:6px; font-weight:bold;">
                        <option value="unselected">-- Select Game Mode --</option>
                        <option value="anagram">Anagrams Game</option>
                        <option value="twenty_questions">20 Questions Game</option>
                    </select>
                </div>
            </div>
            <span class="room-tag" id="room-display">Room: lounge</span>
            
            <!-- Room Selection Screen layout -->
            <div id="panel-unselected" class="game-section" style="display:block; padding:30px 10px; text-align:center;">
                <h3 style="color:var(--accent-warn);">Lounge Initialization Phase</h3>
                <p style="color:var(--text-muted); margin-top:8px;" id="lounge-wait-text">Waiting for host to pick this room's locked game type...</p>
            </div>
            
            <!-- Anagram Panel Layout -->
            <div id="panel-anagram" class="game-section">
                <div class="timer-banner" id="timer-display">00:60</div>
                <div id="countdown-flash-block" class="countdown-flash-banner">3</div>
                <div class="status-msg" id="lock-status-msg">WAITING</div>
                <div class="letter-tray" id="letter-tray"></div>
                <form onsubmit="submitWordLocal(event)"><div class="control-group">
                    <input type="text" id="guess-input" placeholder="Type anagram & press Enter..." autocomplete="off" disabled>
                    <button type="submit" id="guess-submit-btn" class="btn-primary" disabled>Add Word</button>
                </div></form>
                <div class="my-words-box" id="local-words-box" style="margin-bottom:15px; min-height:50px;"></div>
                <div style="display:flex; gap:10px;">
                    <button class="btn-secondary" onclick="shuffleTray()">🔀 Shuffle</button>
                    <button class="btn-success" id="ready-toggle-btn" onclick="toggleReadyState()">✓ Ready for Next Round</button>
                </div>
            </div>

            <!-- 20 Questions Panel Layout -->
            <div id="panel-tq" class="game-section">
                <div class="timer-banner" id="tq-status-banner">Status: Waiting</div>
                <p style="margin-bottom:8px;">Secret Word Tracker: <strong id="tq-word-reveal" style="color:var(--accent-warn); font-family:monospace; letter-spacing:2px;"></strong></p>
                <div id="tq-controls-area" style="margin-bottom:12px;"></div>
                <h3>Questions (<span id="tq-count-num">0</span>/20):</h3>
                <div class="tq-q-box" id="tq-questions-list"></div>
                <div id="tq-ask-area" style="display:none;">
                    <div class="control-group">
                        <input type="text" id="tq-question-input" placeholder="Ask a yes/no question...">
                        <button class="btn-primary" onclick="tqSubmitQuestion()">Ask Question</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="sidebar-column">
            <div class="panel score-board">
                <h3 style="margin-bottom:10px;">Standings</h3>
                <table class="leaderboard-table"><thead><tr><th>Player</th><th>Status</th><th>Score</th></tr></thead><tbody id="leaderboard-body"></tbody></table>
            </div>
            <div class="panel chat-module">
                <h3 style="margin-bottom:10px;">Room Chat</h3>
                <div class="chat-box" id="chat-stream-box"></div>
                <form onsubmit="sendChatMessage(event)"><div class="control-group" style="margin-bottom:0; gap:6px;">
                    <input type="text" id="chat-input" placeholder="Type chat..." autocomplete="off">
                    <button type="submit" class="btn-primary" style="padding:8px 14px;">Send</button>
                </div></form>
            </div>
        </div>
    </div>
    <script>
        let currentRoom = "lounge", myPid = null, amHost = false, localChatCounter = 0;
        let localLetters = [], localRoundWords = [], currentRoundId = -1, serverLettersSig = "";
        let cachedTqStatus = "";

        async function connectToLobby() {
            const name = document.getElementById('username-input').value.trim();
            const roomInput = document.getElementById('room-input').value.trim();
            if(!name) return;
            currentRoom = roomInput || "lounge";
            document.getElementById('room-display').innerText = `Room: ${currentRoom}`;
            const res = await fetch('/api/join', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ name, room: currentRoom, pid: myPid }) });
            const data = await res.json();
            myPid = data.pid; handleBroadcast(data.state, data.is_host);
            document.getElementById('auth-overlay').style.display = 'none';
            setInterval(syncLoop, 1000);
        }

        async function syncLoop() {
            try {
                const res = await fetch('/api/sync', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ room: currentRoom, pid: myPid, buffered_words: localRoundWords, last_chat_id: localChatCounter }) });
                if (res.status === 404) { window.location.reload(); return; }
                const data = await res.json();
                handleBroadcast(data.state, data.is_host);
            } catch(e) {}
        }

        function handleBroadcast(state, isHost) {
            amHost = isHost;
            
            // FIXED: Only show selector if room has not locked down a specific game rule type yet
            if (!state.game_locked && amHost) {
                document.getElementById('host-game-switcher').style.display = 'block';
            } else {
                document.getElementById('host-game-switcher').style.display = 'none';
            }
            
            document.getElementById('panel-unselected').style.display = state.game_type === 'unselected' ? 'block' : 'none';
            document.getElementById('panel-anagram').style.display = state.game_type === 'anagram' ? 'block' : 'none';
            document.getElementById('panel-tq').style.display = state.game_type === 'twenty_questions' ? 'block' : 'none';
            
            if (state.game_type === 'unselected') {
                document.getElementById('game-title').innerText = "Lounge Lobby";
                document.getElementById('lounge-wait-text').innerText = amHost ? "👑 Please select this room's locked game type above." : "Waiting for host to pick this room's locked game type...";
            }
            
            appendIncrementalChats(state.new_chats);
            
            if (state.game_type === 'anagram') {
                document.getElementById('game-title').innerText = "Anagram Arena";
                handleAnagramBroadcast(state);
            } else if (state.game_type === 'twenty_questions') {
                document.getElementById('game-title').innerText = "20 Questions";
                handleTqBroadcast(state);
            }
            
            const tbody = document.getElementById('leaderboard-body'); tbody.innerHTML = '';
            state.leaderboard.forEach(p => {
                const tr = document.createElement('tr');
                const readyLabel = p.ready ? `<span style="color:var(--accent-success); font-weight:bold;">READY</span>` : `<span style="color:var(--text-muted);">WAITING</span>`;
                tr.innerHTML = `<td><strong>${p.name}${p.is_host ? ' 👑':''}</strong></td><td>${state.game_type === 'anagram' ? readyLabel : '-'}</td><td>${p.score} pts</td>`;
                tbody.appendChild(tr);
            });
        }
    </script>
    <script>
        function handleAnagramBroadcast(state) {
            const flashBlock = document.getElementById('countdown-flash-block');
            const txtInput = document.getElementById('guess-input'), btnSubmit = document.getElementById('guess-submit-btn'), statusLabel = document.getElementById('lock-status-msg');
            const readyBtn = document.getElementById('ready-toggle-btn');
            
            if (state.round_id !== currentRoundId) {
                currentRoundId = state.round_id; localLetters = [...state.letters]; renderLetters(localLetters);
                localRoundWords = []; renderLocalWords();
            }
            let comingSig = state.letters.join("");
            if (comingSig !== serverLettersSig) {
                serverLettersSig = comingSig; localLetters = [...state.letters]; renderLetters(localLetters);
            }
            
            updateTimerDisplay(state.time_left);
            
            if (state.countdown_active) {
                flashBlock.style.display = 'block'; flashBlock.innerText = state.time_left;
                txtInput.disabled = true; btnSubmit.disabled = true; readyBtn.disabled = true;
                statusLabel.innerText = "GET READY!"; statusLabel.style.color = "var(--accent-error)";
            } else {
                flashBlock.style.display = 'none';
                if (state.timer_active) {
                    txtInput.disabled = false; btnSubmit.disabled = false; readyBtn.disabled = true;
                    statusLabel.innerText = "ROUND RUNNING - ENTRY ACTIVE"; statusLabel.style.color = "var(--accent-success)";
                } else {
                    txtInput.disabled = true; btnSubmit.disabled = true; readyBtn.disabled = false;
                    statusLabel.innerText = "ROUND FINISHED - READY UP"; statusLabel.style.color = "var(--accent-warn)";
                }
            }
        }

        function submitWordLocal(e) {
            e.preventDefault();
            const input = document.getElementById('guess-input');
            const guess = input.value.trim().toLowerCase().replace(/[^a-z]/g, "");
            input.value = '';
            if (!guess) return;

            if (guess.length < 3 || guess.length > 6) { alert("Must be 3-6 letters!"); return; }
            if (localRoundWords.includes(guess)) { alert("Word already on board!"); return; }

            let trayPool = [...localLetters];
            for (let char of guess) {
                let idx = trayPool.indexOf(char);
                if (idx === -1) { alert(`Letter "${char.toUpperCase()}" is not in the tray grid!`); return; }
                trayPool.splice(idx, 1);
            }
            localRoundWords.push(guess);
            renderLocalWords();
            input.focus();
        }

        function renderLocalWords() {
            const box = document.getElementById('local-words-box'); box.innerHTML = '';
            localRoundWords.forEach(word => {
                const span = document.createElement('span'); span.className = 'word-token'; span.innerText = word; box.appendChild(span);
            });
        }

        function handleTqBroadcast(state) {
            document.getElementById('tq-word-reveal').innerText = state.tq_secret_word || '???';
            document.getElementById('tq-count-num').innerText = state.tq_questions.length;
            const controls = document.getElementById('tq-controls-area'), askArea = document.getElementById('tq-ask-area');
            const banner = document.getElementById('tq-status-banner');
            
            if (cachedTqStatus !== state.tq_status || (state.tq_status === 'waiting_word' && controls.children.length === 0)) {
                cachedTqStatus = state.tq_status;
                if (state.tq_status === 'waiting_thinker') {
                    banner.innerText = "Status: Need a Thinker!";
                    controls.innerHTML = `<button class="btn-primary" onclick="tqActionReq('become_thinker')">Volunteer to be Thinker</button>`;
                    askArea.style.display = 'none';
                } else if (state.tq_status === 'waiting_word') {
                    if (state.tq_thinker_pid === myPid) {
                        banner.innerText = "Status: Enter your secret word below!";
                        controls.innerHTML = `<div class="control-group"><input type="text" id="tq-secret-input" placeholder="Type secret word..."><button class="btn-success" onclick="tqSetWord()">Set Word</button></div>`;
                    } else { banner.innerText = "Status: Thinker is setting word..."; controls.innerHTML = ''; }
                    askArea.style.display = 'none';
                } else if (state.tq_status === 'active') {
                    banner.innerText = state.tq_thinker_pid === myPid ? "Status: Answer Questions!" : "Status: Guessing Phase Active!";
                    controls.innerHTML = '';
                    askArea.style.display = state.tq_thinker_pid === myPid ? 'none' : 'block';
                } else if (state.tq_status === 'won') {
                    banner.innerText = "Status: Word Solved!";
                    controls.innerHTML = `<button class="btn-success" onclick="tqActionReq('become_thinker')">Start New Round</button>`;
                    askArea.style.display = 'none';
                }
            }
            
            const qList = document.getElementById('tq-questions-list'); qList.innerHTML = '';
            state.tq_questions.forEach(q => {
                const div = document.createElement('div'); div.style.cssText = "margin-bottom:6px; padding:6px; background:#0f172a; border-radius:6px; border:1px solid #334155;";
                let ansHtml = q.answer ? `<span style="color:var(--accent-success); font-weight:bold; text-transform:uppercase;">[${q.answer}]</span>` : `<span style="color:var(--accent-warn);">[PENDING]</span>`;
                if (state.tq_thinker_pid === myPid && !q.answer) {
                    ansHtml = `<button class="btn-success" style="padding:2px 8px; font-size:0.8rem; margin-right:4px;" onclick="tqAnswerQ(${q.id}, 'Yes')">Yes</button>
                               <button class="btn-danger" style="padding:2px 8px; font-size:0.8rem; margin-right:4px;" onclick="tqAnswerQ(${q.id}, 'No')">No</button>
                               <button class="btn-secondary" style="padding:2px 8px; font-size:0.8rem; margin-right:4px;" onclick="tqAnswerQ(${q.id}, 'Maybe')">Maybe</button>
                               <button class="btn-primary" style="padding:2px 8px; font-size:0.8rem;" onclick="tqAnswerQ(${q.id}, 'Correct')">That's the Word!</button>`;
                }
                div.innerHTML = `<strong>${q.name}:</strong> ${escapeHtml(q.text)} &rarr; ${ansHtml}`; qList.appendChild(div);
            });
        }
    </script>
    <script>
        async function switchGameMode(gt) { const res = await fetch('/api/game_switch', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ room: currentRoom, pid: myPid, game_type: gt }) }); handleBroadcast((await res.json()).state, amHost); }
        async function tqActionReq(action) { const res = await fetch('/api/tq_action', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ room: currentRoom, pid: myPid, action }) }); handleBroadcast((await res.json()).state, amHost); }
        async function tqSetWord() { const w = document.getElementById('tq-secret-input').value; const res = await fetch('/api/tq_action', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ room: currentRoom, pid: myPid, action: 'set_word', word: w }) }); handleBroadcast((await res.json()).state, amHost); }
        async function tqSubmitQuestion() { const t = document.getElementById('tq-question-input').value; document.getElementById('tq-question-input').value = ''; const res = await fetch('/api/tq_action', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ room: currentRoom, pid: myPid, action: 'ask_question', text: t }) }); handleBroadcast((await res.json()).state, amHost); }
        async function tqAnswerQ(qid, answer) { const res = await fetch('/api/tq_action', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ room: currentRoom, pid: myPid, action: 'answer_question', qid, answer }) }); handleBroadcast((await res.json()).state, amHost); }
        async function toggleReadyState() { const res = await fetch('/api/ready', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ room: currentRoom, pid: myPid }) }); handleBroadcast((await res.json()).state, amHost); }
        async function sendChatMessage(e) { e.preventDefault(); const input = document.getElementById('chat-input'), msg = input.value.trim(); if(!msg) return; input.value = ''; const res = await fetch('/api/chat', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ room: currentRoom, pid: myPid, msg, last_chat_id: localChatCounter }) }); handleBroadcast((await res.json()).state, amHost); }
        
        function appendIncrementalChats(newChatsList) {
            if (!newChatsList || !newChatsList.length) return; const box = document.getElementById('chat-stream-box');
            newChatsList.forEach(c => { if (c.id > localChatCounter) { localChatCounter = c.id; const row = document.createElement('div'); row.className = 'chat-row'; row.innerHTML = `<span class="chat-name">${escapeHtml(c.name)}:</span><span>${escapeHtml(c.msg)}</span>`; box.appendChild(row); } });
            box.scrollTop = box.scrollHeight;
        }
        function updateTimerDisplay(s) { document.getElementById('timer-display').innerText = `00:${String(s).padStart(2, '0')}`; }
        function renderLetters(l) { const t = document.getElementById('letter-tray'); t.innerHTML = ''; l.forEach(x => { const e = document.createElement('div'); e.className = 'letter-tile'; e.innerText = x; t.appendChild(e); }); }
        function shuffleTray() { if(localLetters.includes("?")) return; localLetters.sort(() => Math.random() - 0.5); renderLetters(localLetters); }
        function escapeHtml(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
    </script>
</body>
</html>
